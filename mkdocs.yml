site_name: Learning Notes
site_url: https://emerli.gitlab.io/learning
site_description: Technical documentation and notes
site_author: ataru76

repo_name: ataru76/learning
repo_url: https://gitlab.com/ataru76/learning

theme:
  name: gitbook

plugins:
  - search

nav:
  - Home: index.md
  - Clean Code: clean-code.md
  - Principi SOLID: principi-solid.md
  - Spring Boot Migrazione: spring-boot-migrazione-2.7-to-4.0.md
  - Java Update: java-update.md
  - Spring Boot Update: spring-update.md
  - OpenCode Agents: opencode-agents.md
  - OpenCode Best Practice: opencode-best-practice.md
  - About: about.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.mark
  - admonition
  - tables
  - toc:
      permalink: true