site_name: Learning Notes
site_url: https://koji76.gitlab.io/learning
site_description: Appunti e sintesi tecniche
site_author: koji76

repo_name: koji76/learning
repo_url: https://gitlab.com/koji76/learning

theme:
  name: material
  language: it
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang: it
  - social:
      # set MKDOCS_CARDS=false for a fast local `mkdocs serve`
      cards: !ENV [MKDOCS_CARDS, true]
      cards_layout_options:
        background_color: "#0f1b2d"
        color: "#ffffff"
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      post_excerpt: optional
      archive_date_format: MMMM yyyy
      categories_allowed:
        - Java
        - AI
        - Containers
        - Agile
        - Sicurezza Informatica
  - rss:
      match_path: blog/posts/.*
      use_git: false
      date_from_meta:
        as_creation: date
      categories:
        - categories

nav:
  - Home: index.md
  - Blog:
      - blog/index.md
  - About: about.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.mark
  - toc:
      permalink: true
