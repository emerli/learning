site_name: Learning Notes
site_url: https://emerli.gitlab.io/learning
site_description: Technical documentation and notes
site_author: ataru76

repo_name: ataru76/learning
repo_url: https://gitlab.com/ataru76/learning

theme:
  name: simple-blog

plugins:
  - search

nav:
  - Home: index.md
  - Java:
    - Clean Code: Java/clean-code.md
    - Principi SOLID: Java/principi-solid.md
    - Java Update: Java/java-update.md
  - Spring:
    - Spring Boot Migrazione: Spring/spring-boot-migrazione-2.7-to-4.0.md
    - Spring Boot Update: Spring/spring-update.md
  - Containers:
    - DevOps DevContainer: Containers/devops-devcontainer.md
    - Java Quarkus DevContainer: Containers/java-quarkus-devcontainer.md
    - Mono .NET 4.7 DevContainer: Containers/mono-net47-devcontainer.md
  - AI:
    - OpenCode Agents: AI/opencode-agents.md
    - OpenCode Best Practice: AI/opencode-best-practice.md
    - CLAUDE.md: AI/claude-md.md
    - Spec Kit - Esempio Book API: AI/spec-kit-esempio-book-api.md
    - OpenSpec - Esempio Book API: AI/openspec-esempio-book-api.md
  - Agile:
    - Open Practice Library: Agile/open-practice-library.md
    - Scrum Ripasso: Agile/scrum-ripasso.md
    - GoF Patterns: Agile/gof-patterns.md
  - Blog:
    - Blog Index: blog/index.md
    - Clean Code - Sintesi: blog/posts/clean-code.md
    - Principi SOLID - Sintesi: blog/posts/principi-solid.md
    - Guida alla Migrazione Spring Boot: blog/posts/spring-boot-migrazione-2.7-to-4.0.md
  - About: about.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.mark
  - admonition
  - tables
  - toc:
      permalink: true