site_name: Learning Notes
site_url: https://koji76.gitlab.io/learning
site_description: Technical documentation and notes
site_author: koji76

repo_name: koji76/learning
repo_url: https://gitlab.com/koji76/learning

theme:
  name: simple-blog

plugins:
  - search

nav:
  - Home: index.md
  - Java:
    - Clean Code: Java/clean-code.md
    - Principi SOLID: Java/principi-solid.md
    - Java 8 → 25: Java/java-update.md
    - Spring Boot Migrazione 2.7 → 4.0: Java/spring-boot-migrazione-2.7-to-4.0.md
    - Spring Boot 2.7 → 4.0 Update: Java/spring-update.md
  - Containers:
    - DevOps DevContainer: Containers/devops-devcontainer.md
    - Java Quarkus DevContainer: Containers/java-quarkus-devcontainer.md
    - Mono .NET 4.7 DevContainer: Containers/mono-net47-devcontainer.md
  - AI:
    - Spec Driven Development — Guida Rapida: AI/guida-sdd.md
    - Spec Kit — Esempio Book API: AI/spec-kit-esempio-book-api.md
    - OpenSpec — Esempio Book API: AI/openspec-esempio-book-api.md
    - OpenCode — Agenti e MCP: AI/opencode-agents.md
    - OpenCode — Best Practice: AI/opencode-best-practice.md
    - CLAUDE.md — Preferenze Globali: AI/claude-md.md
    - Transformer e ML.NET: AI/ai-transformer-ml.md
  - Agile:
    - Open Practice Library: Agile/open-practice-library.md
    - Ripasso Scrum: Agile/scrum-ripasso.md
    - Pattern GoF: Agile/gof-patterns.md
  - Sicurezza Informatica:
    - Information Gathering con Kali: SicurezzaInformatica/information-gathering-kali.md
    - Metasploitable 2 — Recon Report: SicurezzaInformatica/metasploitable-recon.md
    - Exploitation & Post-Exploitation — Checklist: SicurezzaInformatica/exploitation-checklist.md
    - Linux Privilege Escalation: SicurezzaInformatica/linux-privilege-escalation.md
  - Indice completo: blog/index.md
  - About: about.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.mark
  - admonition
  - tables
  - toc:
      permalink: true
