pages:
  stage: deploy
  image: python:3.12-slim
  before_script:
    # system libs required by the Material `social` plugin (Cairo + Pango + fonts)
    - apt-get update && apt-get install -y --no-install-recommends
      libcairo2 libfreetype6 libpango-1.0-0 libpangocairo-1.0-0 libglib2.0-0
      libjpeg62-turbo fonts-dejavu-core
    - pip install "mkdocs-material[imaging]==9.7.7" "mkdocs-rss-plugin==1.19.0"
  script:
    - mkdocs build --strict
    - mv site public
  artifacts:
    paths:
      - public
  cache:
    key: mkdocs-social
    paths:
      - .cache/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
